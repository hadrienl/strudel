<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier Strudel</title>
<meta name="description" content="Morceaux écrits en Strudel, jouables directement dans le navigateur.">
<style>
:root {
  --bg: #fbfaf8; --fg: #1a1a1a; --muted: #6b6b6b; --card: #fff;
  --line: #e6e3dd; --accent: #b3541e; --accent-fg: #fff; --tag: #f0ede7;
  --sel: #fdf1e7; --ok: #2f7d4f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14141a; --fg: #eceaf0; --muted: #9a97a5; --card: #1d1d25;
    --line: #2e2e3a; --accent: #e8834a; --accent-fg: #14141a; --tag: #26262f;
    --sel: #2a2029; --ok: #6cc48d;
  }
}
:root[data-theme="light"] {
  --bg: #fbfaf8; --fg: #1a1a1a; --muted: #6b6b6b; --card: #fff;
  --line: #e6e3dd; --accent: #b3541e; --accent-fg: #fff; --tag: #f0ede7;
  --sel: #fdf1e7; --ok: #2f7d4f;
}
:root[data-theme="dark"] {
  --bg: #14141a; --fg: #eceaf0; --muted: #9a97a5; --card: #1d1d25;
  --line: #2e2e3a; --accent: #e8834a; --accent-fg: #14141a; --tag: #26262f;
  --sel: #2a2029; --ok: #6cc48d;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 2.5rem 1.25rem 4rem; background: var(--bg); color: var(--fg);
  font: 16px/1.6 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
}
.wrap { max-width: 68rem; margin: 0 auto; }
header { border-bottom: 1px solid var(--line); padding-bottom: 1.25rem; margin-bottom: 1.75rem; }
h1 { margin: 0 0 .35rem; font-size: 1.8rem; letter-spacing: -.02em; }
.lede { margin: 0; color: var(--muted); max-width: 44rem; font-size: .95rem; }
.layout { display: grid; grid-template-columns: 20rem 1fr; gap: 1.5rem; align-items: start; }
@media (max-width: 56rem) { .layout { grid-template-columns: 1fr; } }

.list { display: flex; flex-direction: column; gap: .5rem; }
.item {
  text-align: left; width: 100%; font: inherit; cursor: pointer; color: var(--fg);
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: .8rem .9rem; transition: border-color .12s, background .12s;
}
.item:hover { border-color: var(--accent); }
.item[aria-current="true"] { border-color: var(--accent); background: var(--sel); }
.item h2 { margin: 0 0 .35rem; font-size: .98rem; letter-spacing: -.01em; }
.tags { display: flex; flex-wrap: wrap; gap: .3rem; }
.tag { background: var(--tag); color: var(--muted); border-radius: 999px;
       padding: .1rem .5rem; font-size: .72rem; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
         padding: 1.1rem 1.2rem 1.3rem; min-height: 16rem; }
.panel h2 { margin: 0 0 .5rem; font-size: 1.25rem; letter-spacing: -.01em; }
.struct { margin: .6rem 0 0; color: var(--muted); font-size: .82rem;
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          overflow-x: auto; white-space: nowrap; padding-bottom: .2rem; }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: 1rem 0 .5rem; }
button, a.btn {
  font: inherit; font-size: .88rem; border-radius: 8px; padding: .45rem .9rem;
  cursor: pointer; border: 1px solid var(--line); background: transparent;
  color: var(--fg); text-decoration: none;
}
button:hover, a.btn:hover { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent;
                 font-weight: 600; min-width: 6.5rem; }
button.primary:hover { filter: brightness(1.08); color: var(--accent-fg); }
button[disabled] { opacity: .45; cursor: not-allowed; }
.status { color: var(--muted); font-size: .8rem; margin-left: auto; }
.status.on { color: var(--ok); }
.editor { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: .5rem; }
.editor:empty { display: none; }
.note { color: var(--muted); font-size: .85rem; margin: .75rem 0 0; }
.warn { border-left: 3px solid var(--accent); padding-left: .8rem; }
.empty { color: var(--muted); display: grid; place-items: center; min-height: 12rem; text-align: center; }
footer { margin-top: 2.5rem; padding-top: 1.1rem; border-top: 1px solid var(--line);
         color: var(--muted); font-size: .84rem; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em;
       background: var(--tag); padding: .1rem .35rem; border-radius: 4px; }
.cm-editor { max-height: 60vh; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Atelier Strudel</h1>
    <p class="lede">Morceaux écrits en <a href="https://strudel.cc">Strudel</a>, un langage
    de live coding musical. Choisis un morceau : il se charge dans un éditeur jouable et
    modifiable en direct. Le premier lancement télécharge le moteur audio et les
    échantillons — compte quelques secondes.</p>
  </header>

  <div class="layout">
    <nav class="list" id="list" aria-label="Morceaux"></nav>
    <section class="panel" id="panel">
      <div class="empty" id="empty">Chargement…</div>
    </section>
  </div>

  <footer id="footer"></footer>
</div>

<script type="module">
const CDN = 'https://unpkg.com/@strudel/repl@1.3.0';

const $list = document.getElementById('list');
const $panel = document.getElementById('panel');
const $footer = document.getElementById('footer');

let tracks = [];
let current = null;
let engineReady = false;
const codeCache = new Map();

// Le REPL encode le patch entier dans le hash : base64 UTF-8 puis encodeURIComponent.
const toStrudelUrl = (code) =>
  'https://strudel.cc/#' + encodeURIComponent(
    btoa(String.fromCharCode(...new TextEncoder().encode(code)))
  );

async function fetchCode(file) {
  if (codeCache.has(file)) return codeCache.get(file);
  const res = await fetch(file);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const code = await res.text();
  codeCache.set(file, code);
  return code;
}

function tagsOf(list) {
  const box = document.createElement('div');
  box.className = 'tags';
  for (const tag of list) {
    const s = document.createElement('span');
    s.className = 'tag';
    s.textContent = tag;
    box.append(s);
  }
  return box;
}

function renderList() {
  $list.replaceChildren(...tracks.map((t, i) => {
    const b = document.createElement('button');
    b.className = 'item';
    b.type = 'button';
    b.setAttribute('aria-current', String(i === current));
    const h = document.createElement('h2');
    h.textContent = t.title;
    b.append(h, tagsOf(t.tags));
    b.addEventListener('click', () => select(i));
    return b;
  }));
}

async function select(i) {
  current = i;
  renderList();
  const t = tracks[i];
  history.replaceState(null, '', '#' + encodeURIComponent(t.title));

  $panel.replaceChildren();
  const h = document.createElement('h2');
  h.textContent = t.title;
  $panel.append(h, tagsOf(t.tags));

  if (t.structure) {
    const p = document.createElement('p');
    p.className = 'struct';
    p.textContent = t.structure;
    $panel.append(p);
  }

  const actions = document.createElement('div');
  actions.className = 'actions';
  const play = document.createElement('button');
  play.className = 'primary';
  play.textContent = '▶ Jouer';
  play.disabled = true;
  const open = document.createElement('a');
  open.className = 'btn';
  open.textContent = 'Ouvrir dans strudel.cc';
  open.target = '_blank';
  open.rel = 'noopener';
  const copy = document.createElement('button');
  copy.textContent = 'Copier le lien';
  copy.disabled = true;
  const status = document.createElement('span');
  status.className = 'status';
  status.textContent = 'chargement…';
  actions.append(play, open, copy, status);
  $panel.append(actions);

  const host = document.createElement('div');
  host.className = 'editor';
  $panel.append(host);

  let code;
  try {
    code = await fetchCode(t.file);
  } catch (err) {
    status.textContent = '';
    const p = document.createElement('p');
    p.className = 'note warn';
    p.textContent = `Impossible de charger ${t.file} — ${err.message}. `
      + 'Une page ouverte depuis le disque (file://) ne peut pas lire les fichiers voisins : '
      + 'servir le dossier, par exemple avec « python3 -m http.server ».';
    $panel.append(p);
    return;
  }
  if (current !== i) return;  // l'utilisateur a changé de morceau entre-temps

  const url = toStrudelUrl(code);
  open.href = url;
  copy.disabled = false;
  copy.addEventListener('click', async () => {
    await navigator.clipboard.writeText(url);
    copy.textContent = 'Lien copié';
    setTimeout(() => { copy.textContent = 'Copier le lien'; }, 1600);
  });

  if (!engineReady) {
    status.textContent = '';
    const p = document.createElement('p');
    p.className = 'note warn';
    p.textContent = "Le moteur audio n'a pas pu être chargé depuis le CDN — le player est "
      + "indisponible. « Ouvrir dans strudel.cc » reste utilisable : le lien contient le morceau entier.";
    $panel.append(p);
    return;
  }

  // Le web component construit son éditeur dans un conteneur inséré juste après lui.
  const el = document.createElement('strudel-editor');
  el.setAttribute('code', code);
  host.append(el);

  el.addEventListener('update', (e) => {
    const on = !!e.detail?.started;
    play.textContent = on ? '■ Arrêter' : '▶ Jouer';
    status.textContent = on ? 'en lecture' : 'prêt';
    status.classList.toggle('on', on);
  });

  for (let n = 0; n < 100 && !el.editor; n++) await new Promise((r) => setTimeout(r, 50));
  if (current !== i) return;

  if (el.editor) {
    play.disabled = false;
    status.textContent = 'prêt';
    play.addEventListener('click', () => el.editor.toggle());
  } else {
    status.textContent = '';
    const p = document.createElement('p');
    p.className = 'note warn';
    p.textContent = "L'éditeur ne s'est pas initialisé. Utiliser « Ouvrir dans strudel.cc ».";
    $panel.append(p);
  }
}

(async () => {
  try {
    const res = await fetch('tracks.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    tracks = await res.json();
  } catch (err) {
    $panel.replaceChildren();
    const p = document.createElement('p');
    p.className = 'note warn';
    p.textContent = `tracks.json introuvable (${err.message}). `
      + 'Régénérer le manifeste avec : python3 bin/build-index.py — et servir le dossier '
      + 'par HTTP plutôt que de l\'ouvrir en file://.';
    $panel.append(p);
    return;
  }

  renderList();
  $footer.textContent = `${tracks.length} morceaux · manifeste tracks.json · moteur @strudel/repl 1.3.0`;

  try {
    await import(CDN);
    await customElements.whenDefined('strudel-editor');
    engineReady = true;
  } catch (err) {
    engineReady = false;
  }

  const wanted = decodeURIComponent(location.hash.slice(1));
  const i = tracks.findIndex((t) => t.title === wanted);
  select(i >= 0 ? i : 0);
})();
</script>
</body>
</html>
